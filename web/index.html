<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="src/css/style.css" rel="stylesheet">
  <script type="module" src="src/ts/app.js"></script>

  <!-- External JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>

<body data-theme="dark">
  <div class="tile">PixelMatrix</div>
  <div class="tile">Explanation Placeholder</div>
  <app class="tile">
    <div class="all-settings-container">
      <div class="general-settings-container">
        <select id="setting-language">
          <option value="rhai">Rhai (rust like syntax)</option>
        </select>
        <select id="setting-output-type">
          <option value="grid">Grid</option>
        </select>
      </div>
      <div class="output-settings-container"></div>
    </div>
    <div id="input-output-container" class="input-output-container">
      <div id="editor-container" style="width: 800px; height: 600px; border: 1px solid var(--border);"></div>
      <div class="seperator"></div>
      <canvas id="canvas-output" width="600" height="600"></canvas>
    </div>
    <div class="controls-container">
      <div>
        <button id="run-btn" class="btn">
          Run
        </button>
        <button id="clear-btn" class="btn btn-danger">Clear</button>
      </div>
      <div id="notification-space" class="notification"></div>
    </div>
    <canvas id="canvas-hidden" width="16" height="16" style="display: none;"></canvas>
  </app>
</body>

</html>
