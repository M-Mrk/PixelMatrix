<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="css/style.css" rel="stylesheet">
  <script type="module" src="js/app.js"></script>

  <!-- External JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>

<body data-theme="dark">
  <div class="tile">PixelMatix</div>
  <div class="tile">Explanation Placeholder</div>
  <app class="tile">
    <div id="input-output-container" class="input-output-container">
      <div id="editor-container" style="width: 800px; height: 600px; border: 1px solid var(--border);"></div>
      <div class="seperator"></div>
      <canvas id="canvas-output" width="600" height="600"></canvas>
    </div>
    <div class="controls-container">
      <div>
        <button id="run-btn" class="btn">Run</button>
        <button id="clear-btn" class="btn btn-danger">Clear</button>
      </div>
      <div id="notification-space" class="notification"></div>
    </div>
  </app>
</body>

</html>
