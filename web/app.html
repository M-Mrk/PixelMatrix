<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="src/css/style.css" rel="stylesheet">
</head>

<body data-theme="dark">
  <div class="workspace" data-focused="code">
    <div class="topbar">
      <div>PixelMatrix</div>
      <div class="top-interactives">
        <div id="top-settings" class="input-group">
          <div id="setting-language" class="tui-select" data-selected="rhai">
            <div class="tui-select-trigger">Language</div>
            <div class="tui-select-dropdown" id="setting-language">
              <div class="tui-select-option selected" data-value="rhai">Rhai</div>
            </div>
          </div>
          <div id="setting-output-type" class="tui-select" data-selected="grid">
            <div class="tui-select-trigger">Output</div>
            <div class="tui-select-dropdown" id="setting-output-type">
              <div class="tui-select-option selected" data-value="grid">Grid</div>
            </div>
          </div>
          <label class="checkbox">
            <input type="checkbox" name="hot-reload" id="setting-hot-reload">
            <span>Hot reload</span>
          </label>
        </div>
        <div id="top-tools" class="input-group">
          <button id="run-btn">Run</button>
          <button id="clear-btn">Clear</button>
        </div>
      </div>
    </div>
    <div class="tabbar" id="tabbar"></div>

    <div id="in-out-container" class="in-out-container">
      <div class="editor-container" id="editor-container"></div>

      <div class="output-container">
        <div class="output-toolbar" id="output-toolbar"></div>
        <div class="output-inner" id="output-inner"></div>
      </div>

      <div class="middle-icon" id="middle-icon"></div>
    </div>

    <div id="console-grid-placeholder"> <!-- relative positioned item in the workspace grid -->
      <div id="console" class="console"> <!-- absolut postioned wrapper that resizes with drag handle -->
        <div id="console-header" class="console-header">
          <div>Console</div>
          <div id="console-handle" class="console-handle">=====</div>
        </div>
        <div id="console-inner" class="console-inner">
          <div id="console-scroll" class="console-scroll">
            <div id="console-spacer"></div>
          </div>
          <div id="console-content" class="console-content"></div>
        </div>
        <div class="error-pop" id="error-pop">
          <diV class="error-pop-inner">
            <span class="error-pop-title">Error</span>
            <div class="error-pop-content" id="error-pop-content"></div>
          </diV>
        </div>
      </div>
    </div>

    <script type="module" src="src/ts/app.js"></script>
    <!-- External JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</body>

</html>
