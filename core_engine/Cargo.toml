[package]
name = "core_engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_log = { version = "1.1.0", features = ["wasm-bindgen"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
log = "0.4.33"
log-panics = "2.1.0"
rand = "0.10.2"
rhai = { version = "1.25.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.126"
web-time = "1.1.0"
